<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root {
      --bg: #f3f1ea;
      --ink: #18211b;
      --muted: #667066;
      --line: #cfc8b8;
      --accent: #0f766e;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top left, rgba(15,118,110,.11), transparent 34%), var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      line-height: 1.55;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 36px 24px 64px;
    }
    .meta {
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 28px;
      font-size: 13px;
    }
    h1, h2, h3, h4, h5, h6 { line-height: 1.18; margin: 1.35em 0 .45em; }
    h1 { font-size: 34px; margin-top: 0; }
    h2 { font-size: 24px; }
    h3 { font-size: 18px; color: var(--accent); }
    p { margin: .6em 0; }
    ul { padding-left: 1.4em; }
    li { margin: .35em 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 24px 0; }
    code {
      background: rgba(15,118,110,.09);
      border: 1px solid rgba(15,118,110,.18);
      border-radius: 4px;
      padding: 1px 4px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: .92em;
    }
    pre {
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfaf5;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="meta">{{ packet_path }} / {{ filename }}</div>
    {# body is produced by web.markdown.markdown_to_html, which escapes all source text. #}
    {{ body | safe }}
  </main>
</body>
</html>
