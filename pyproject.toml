[project]
name = "job-search-tool"
version = "0.2.0"
description = "Local CRM and scoring tool for a job search."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
# Deviation from PEP 8's 79 columns: prompt text and SQL read more clearly at 120.
line-length = 120

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, pep8-naming, simplify, bandit (security), builtins
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "S", "A"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assertion rewriting relies on bare assert statements.
# S104: tests pass "0.0.0.0" deliberately to verify the remote-bind guard rejects it.
"tests/**" = ["S101", "S104"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=job_search --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["job_search"]

[tool.coverage.report]
fail_under = 80
show_missing = true
