# Quality gate: every push and pull request must pass lint, formatting, tests with
# coverage, a dependency vulnerability audit, and syntax checks. Make the "quality"
# check required in a branch protection rule or ruleset on main so failing changes
# cannot be merged (see README "Continuous Integration").
name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs for replayable, tamper-resistant builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install pinned, hash-verified dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff, including bandit security rules)
        run: .venv/bin/ruff check --output-format=github .

      - name: Formatting
        run: .venv/bin/ruff format --check .

      - name: Tests with coverage (fails below 80%)
        run: .venv/bin/python -m pytest

      - name: Dependency vulnerability audit
        run: .venv/bin/pip-audit --require-hashes --disable-pip -r requirements.lock

      - name: Script syntax
        run: |
          node --check job_search/web/static/app.js
          bash -n run.sh
